name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # internal/testutil creates its own throwaway database per test
      # against this service (see TEST_DATABASE_URL) and drops it
      # afterward — nothing here is a persistent app database.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./... -race

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecomwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      # `next build` prerenders the public pages, which fetch real data
      # from the Go API at build time — so a live API + seeded database is
      # needed here too, not just for the api/ job's own tests.
      - name: Apply migrations and stub Supabase auth schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ecomwa -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users (id uuid primary key default gen_random_uuid());
          create function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          SQL
          for f in api/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d ecomwa -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build and start API server
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecomwa?sslmode=disable
          SUPABASE_JWT_SECRET: ci-placeholder-secret
          PORT: 8080
        run: |
          go build -o /tmp/api-server .
          /tmp/api-server &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npx eslint .

      - name: Build
        working-directory: web
        env:
          GO_API_URL: http://localhost:8080
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_WHATSAPP_NUMBER: "6281234567890"
        run: npm run build
